services:
  - type: web
    name: epm-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: DEFAULT_TENANT_SLUG
        value: cubic
      - key: PLATFORM_ADMIN_EMAIL
        value: editcomedia@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
